# AI 面试语音作答需要 HTTPS（浏览器录音权限要求安全上下文）
# 将本文件加入 nginx sites，替换 server_name / 证书路径后 reload
server {
    listen 443 ssl;
    server_name your-domain-or-server-ip;

    ssl_certificate     /etc/letsencrypt/live/YOUR_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_HOST/privkey.pem;

    # 前端静态资源
    location / {
        root /path/to/hr-saas/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }
}
